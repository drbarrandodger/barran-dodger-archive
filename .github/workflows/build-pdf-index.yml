name: Build PDF Index

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  build-pdf-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout archive
        uses: actions/checkout@v4

      - name: Build PDF index
        run: |
          mkdir -p public/data

          node <<'NODE'
          const fs = require('fs');
          const https = require('https');

          const owners = ['Barrandodger', 'Wezzo72'];
          const results = [];

          function request(url) {
            return new Promise((resolve, reject) => {
              https.get(url, {
                headers: {
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'Barran-Dodger-Archive'
                }
              }, res => {
                let data = '';

                res.on('data', chunk => data += chunk);

                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) {
                    resolve(JSON.parse(data));
                  } else {
                    reject(new Error(`${res.statusCode}: ${data}`));
                  }
                });
              }).on('error', reject);
            });
          }

          async function getAllRepos(owner) {
            let page = 1;
            const repos = [];

            while (true) {
              const url =
                `https://api.github.com/users/${owner}/repos?per_page=100&page=${page}&type=public`;

              const data = await request(url);

              if (!data.length) break;

              repos.push(...data);

              if (data.length < 100) break;

              page++;
            }

            return repos;
          }

          async function scanRepo(owner, repo) {
            try {
              const branch = repo.default_branch || 'main';

              const url =
                `https://api.github.com/repos/${owner}/${repo.name}/git/trees/${encodeURIComponent(branch)}?recursive=1`;

              const tree = await request(url);

              if (!tree.tree) return;

              for (const item of tree.tree) {
                if (
                  item.type === 'blob' &&
                  item.path &&
                  item.path.toLowerCase().endsWith('.pdf')
                ) {
                  results.push({
                    title: item.path.split('/').pop(),
                    path: item.path,
                    owner: owner,
                    repository: repo.name,
                    branch: branch,
                    url: `https://github.com/${owner}/${repo.name}/blob/${branch}/${item.path}`,
                    raw_url: `https://raw.githubusercontent.com/${owner}/${repo.name}/${branch}/${item.path}`,
                    source: `GitHub/${owner}/${repo.name}`
                  });
                }
              }
            } catch (error) {
              console.log(
                `Could not scan ${owner}/${repo.name}: ${error.message}`
              );
            }
          }

          (async () => {
            for (const owner of owners) {
              console.log(`Searching public repositories for ${owner}...`);

              let repos = [];

              try {
                repos = await getAllRepos(owner);
              } catch (error) {
                console.log(
                  `Could not retrieve repositories for ${owner}: ${error.message}`
                );
                continue;
              }

              console.log(
                `${owner}: ${repos.length} public repositories found.`
              );

              for (const repo of repos) {
                console.log(`Scanning ${owner}/${repo.name}...`);
                await scanRepo(owner, repo);
              }
            }

            results.sort((a, b) =>
              a.title.localeCompare(b.title)
            );

            const output = {
              generated_at: new Date().toISOString(),
              owners,
              total_pdfs: results.length,
              documents: results
            };

            fs.writeFileSync(
              'public/data/documents.json',
              JSON.stringify(output, null, 2)
            );

            console.log(
              `PDF index complete: ${results.length} PDFs found.`
            );
          })();
          NODE

      - name: Show index statistics
        run: |
          echo "PDF index created:"
          cat public/data/documents.json | head -40
          echo
          echo "File size:"
          du -h public/data/documents.json

      - name: Commit updated PDF index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/documents.json

          if git diff --cached --quiet; then
            echo "No changes to PDF index."
          else
            git commit -m "Update automatic PDF index"
            git push
          fi
