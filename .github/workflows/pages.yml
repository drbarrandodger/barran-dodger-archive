name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (fresh, no cache)
        run: npm ci --legacy-peer-deps

      - name: Remove conflicting Tailwind v4 package
        run: npm rm @tailwindcss/vite --ignore-scripts 2>/dev/null || true

      - name: Clear old dist (prevent stale artifacts)
        run: rm -rf dist/ghpages

      - name: Build frontend for GitHub Pages
        run: |
          NODE_ENV=production npx vite build \
            --config vite.config.gh-pages.ts
          echo "=== Built files ==="
          ls -la dist/ghpages/
          ls dist/ghpages/assets/ | wc -l
          du -sh dist/ghpages/

      - name: Verify build has correct title
        run: |
          TITLE=$(grep -o '<title>[^<]*' dist/ghpages/index.html | head -1 || echo "MISSING")
          echo "Title: $TITLE"
          if echo "$TITLE" | grep -qi "portal\|MISSING"; then
            echo "ERROR: index.html still has wrong title!"
            exit 1
          fi
          echo "Build verified OK"

      - name: Add SPA 404 routing + .nojekyll
        run: |
          cp dist/ghpages/index.html dist/ghpages/404.html
          touch dist/ghpages/.nojekyll

      - name: Remove directories too large for GitHub Pages (>100MB)
        run: |
          rm -rf dist/ghpages/documents dist/ghpages/audio dist/ghpages/video
          echo "=== Final size ===" && du -sh dist/ghpages/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/ghpages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy: ${{ github.sha }}'
