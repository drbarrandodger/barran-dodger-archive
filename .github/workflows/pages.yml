name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for GitHub Pages
        run: |
          mkdir -p dist/public
          VITE_GITHUB_PAGES=true NODE_ENV=production \
            npx vite build --outDir "$(pwd)/dist/public" --emptyOutDir
          echo "=== Build output ==="
          ls dist/public/ && du -sh dist/public/

      - name: Add SPA 404 routing + nojekyll
        run: |
          cp dist/public/index.html dist/public/404.html
          touch dist/public/.nojekyll

      - name: Remove dirs too large for Pages (keep all images in assets/)
        run: |
          rm -rf dist/public/documents dist/public/evidence dist/public/audio dist/public/video
          echo "=== Final size ===" && du -sh dist/public/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
