name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend only (bypasses server build + pruning)
        run: npx vite build
        env:
          NODE_ENV: production
          VITE_GITHUB_PAGES: "true"

      - name: Debug build output
        run: ls dist/public/ && du -sh dist/public/

      - name: Add SPA 404 routing
        run: cp dist/public/index.html dist/public/404.html

      - name: Add .nojekyll
        run: touch dist/public/.nojekyll

      - name: Remove dirs too large for Pages (keep images/assets intact)
        run: |
          rm -rf dist/public/documents dist/public/evidence dist/public/audio dist/public/video
          echo "Final size:" && du -sh dist/public/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
