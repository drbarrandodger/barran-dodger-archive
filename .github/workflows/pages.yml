name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clear old dist (prevent stale artifacts)
        run: rm -rf dist && mkdir -p dist/public

      - name: Build frontend for GitHub Pages
        run: |
          NODE_ENV=production npx vite build \
            --config vite.config.gh-pages.ts \
            --outDir dist/public \
            --emptyOutDir
          echo "=== Built files ==="
          ls -la dist/public/
          ls -la dist/public/assets/ | head -20
          du -sh dist/public/

      - name: Verify build output
        run: |
          if [ ! -f dist/public/index.html ]; then
            echo "ERROR: index.html not found in dist/public/"
            exit 1
          fi
          TITLE=$(grep -o '<title>[^<]*' dist/public/index.html | head -1)
          echo "Title: $TITLE"
          if echo "$TITLE" | grep -qi "portal"; then
            echo "ERROR: index.html still has old portal title!"
            exit 1
          fi
          echo "Build verified OK"

      - name: Add SPA 404 routing + .nojekyll
        run: |
          cp dist/public/index.html dist/public/404.html
          touch dist/public/.nojekyll

      - name: Remove directories too large for GitHub Pages
        run: |
          rm -rf dist/public/documents dist/public/evidence dist/public/audio dist/public/video
          echo "=== Final size ===" && du -sh dist/public/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/public
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy: ${{ github.sha }}'
