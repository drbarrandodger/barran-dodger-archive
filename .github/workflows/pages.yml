name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Remove Tailwind v4 packages (prevent CSS conflict)
        run: |
          rm -rf node_modules/@tailwindcss/vite \
                 node_modules/@tailwindcss/postcss \
                 node_modules/@tailwindcss/node \
                 node_modules/@tailwindcss/oxide \
                 node_modules/@tailwindcss/oxide-linux-x64-gnu \
                 node_modules/@tailwindcss/oxide-linux-x64-musl
          TW=$(node -p "require('./node_modules/tailwindcss/package.json').version" 2>/dev/null || echo "ERROR")
          echo "Tailwindcss version: $TW"
          if [[ "$TW" != 3* ]]; then echo "ERROR: tailwindcss is not v3!" && exit 1; fi

      - name: Clear old dist
        run: rm -rf dist/ghpages

      - name: Build frontend for GitHub Pages
        run: NODE_ENV=production npx vite build --config vite.config.gh-pages.ts

      - name: Show build results
        run: |
          ls -la dist/ghpages/
          ls dist/ghpages/assets/ | wc -l
          du -sh dist/ghpages/

      - name: Add SPA 404 routing and .nojekyll
        run: |
          cp dist/ghpages/index.html dist/ghpages/404.html
          touch dist/ghpages/.nojekyll

      - name: Remove oversized directories
        run: |
          rm -rf dist/ghpages/documents dist/ghpages/audio dist/ghpages/video
          du -sh dist/ghpages/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/ghpages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy: ${{ github.sha }}'
