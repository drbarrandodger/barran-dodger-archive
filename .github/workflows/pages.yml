name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for GitHub Pages
        run: |
          mkdir -p dist/public
          VITE_GITHUB_PAGES=true NODE_ENV=production \
            npx vite build --outDir "$(pwd)/dist/public" --emptyOutDir
          echo "=== Build output ==="
          ls dist/public/ && du -sh dist/public/

      - name: Add SPA 404 routing + .nojekyll
        run: |
          cp dist/public/index.html dist/public/404.html
          touch dist/public/.nojekyll

      - name: Remove dirs too large for GitHub Pages
        run: |
          rm -rf dist/public/documents dist/public/evidence dist/public/audio dist/public/video
          echo "=== Final size ===" && du -sh dist/public/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/public
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy: update GitHub Pages to match barrandodger.com'
