<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Archive — Barran Dodger</title>
<style>
body{font-family:Arial;margin:0;background:#101827;color:white}
header{padding:25px;text-align:center;background:#18243a}
main{max-width:1000px;margin:auto;padding:20px}
input,select{width:100%;padding:14px;margin:6px 0 15px;background:#172238;color:white;border:1px solid #456;border-radius:7px;font-size:16px}
.card{background:#172238;padding:16px;margin:12px 0;border-radius:8px}
a{color:#8ecaff}
button{padding:10px;background:#2864ad;color:white;border:0;border-radius:6px}
</style>
</head>
<body>

<header>
<h1>PDF Archive</h1>
<p>602 indexed documents</p>
<a href="../index.html">← Back to Archive</a>
</header>

<main>

<input id="search" placeholder="Search documents...">

<select id="owner">
<option value="">All sources</option>
<option>Barrandodger</option>
<option>Wezzo72</option>
</select>

<p id="count">Loading...</p>
<div id="list"></div>

</main>

<script>
let docs=[];

async function start(){
  try{
    const r=await fetch("https://raw.githubusercontent.com/drbarrandodger/barran-dodger-archive/main/data/documents.json");
    const d=await r.json();
    docs=d.documents||[];
    show();
  }catch(e){
    document.getElementById("count").textContent="Could not load document index.";
  }
}

function show(){
  const q=document.getElementById("search").value.toLowerCase();
  const o=document.getElementById("owner").value;

  const found=docs.filter(x=>{
    const text=(x.title+" "+x.path+" "+x.repository+" "+x.owner).toLowerCase();
    return text.includes(q)&&(!o||x.owner===o);
  });

  document.getElementById("count").textContent=
    "Showing "+found.length+" of "+docs.length+" documents";

  document.getElementById("list").innerHTML=found.map(x=>`
    <div class="card">
      <strong>${escape(x.title)}</strong>
      <p>${escape(x.owner)} / ${escape(x.repository)}</p>
      <a href="${x.raw_url}" target="_blank">View / Download PDF</a>
    </div>
  `).join("");
}

function escape(x){
  return String(x||"").replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

document.getElementById("search").oninput=show;
document.getElementById("owner").onchange=show;

start();
</script>

</body>
</html>
