<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Archive — Barran Dodger</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#101827;
  color:#fff;
  line-height:1.5;
}

header{
  padding:28px 20px;
  text-align:center;
  background:#18243a;
}

header h1{
  margin:0 0 8px;
}

header a{
  color:#8ecaff;
}

main{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

input,select{
  width:100%;
  padding:14px;
  margin:6px 0 15px;
  background:#172238;
  color:white;
  border:1px solid #456;
  border-radius:7px;
  font-size:16px;
}

.card{
  background:#172238;
  padding:16px;
  margin:12px 0;
  border-radius:8px;
  border:1px solid #293953;
}

.card strong{
  display:block;
  font-size:18px;
  overflow-wrap:anywhere;
}

.card p{
  color:#b9c5d8;
  font-size:14px;
}

.card a{
  color:#8ecaff;
  font-weight:bold;
}

#count{
  color:#b9c5d8;
}

.error{
  background:#321923;
  border:1px solid #8b4055;
  padding:18px;
  border-radius:8px;
}

.loading{
  padding:20px;
  text-align:center;
}
</style>
</head>

<body>

<header>
  <h1>PDF Archive</h1>
  <p>Public PDF catalogue — Barrandodger &amp; Wezzo72</p>
  <p>
    <a href="../index.html">← Back to Public Archive</a>
  </p>
</header>

<main>

  <h2>Search the Documents</h2>

  <input
    id="search"
    type="search"
    placeholder="Search title, repository, owner or path..."
  >

  <select id="owner">
    <option value="">All sources</option>
    <option value="Barrandodger">Barrandodger</option>
    <option value="Wezzo72">Wezzo72</option>
  </select>

  <p id="count">Loading document catalogue...</p>

  <div id="list">
    <div class="loading">Loading PDFs...</div>
  </div>

</main>

<script>

let documents = [];

const searchBox = document.getElementById("search");
const ownerBox = document.getElementById("owner");
const countBox = document.getElementById("count");
const listBox = document.getElementById("list");


async function loadDocuments(){

  try{

    /*
      The automatic PDF index is generated by GitHub Actions
      and stored at public/data/documents.json.
    */

    const response = await fetch(
      "../public/data/documents.json",
      {
        cache:"no-store"
      }
    );

    if(!response.ok){
      throw new Error(
        "Could not load the PDF index. HTTP " +
        response.status
      );
    }

    const data = await response.json();

    documents = Array.isArray(data.documents)
      ? data.documents
      : [];

    renderDocuments();

  }catch(error){

    countBox.textContent = "";

    listBox.innerHTML = `
      <div class="error">
        <strong>Document catalogue could not be loaded.</strong>
        <p>${escapeHTML(error.message)}</p>
      </div>
    `;
  }

}


function renderDocuments(){

  const search =
    searchBox.value
      .trim()
      .toLowerCase();

  const owner =
    ownerBox.value;

  const filtered =
    documents.filter(document => {

      const searchable = [

        document.title,
        document.path,
        document.owner,
        document.repository,
        document.source

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

      const matchesSearch =
        !search ||
        searchable.includes(search);

      const matchesOwner =
        !owner ||
        document.owner === owner;

      return matchesSearch && matchesOwner;

    });


  countBox.textContent =
    "Showing " +
    filtered.length +
    " of " +
    documents.length +
    " indexed PDFs";


  if(filtered.length === 0){

    listBox.innerHTML = `
      <div class="card">
        <strong>No matching documents found.</strong>
      </div>
    `;

    return;
  }


  listBox.innerHTML =
    filtered.map((document,index) => {

      const title =
        escapeHTML(
          document.title ||
          "Untitled PDF"
        );

      const owner =
        escapeHTML(
          document.owner ||
          ""
        );

      const repository =
        escapeHTML(
          document.repository ||
          ""
        );

      const path =
        escapeHTML(
          document.path ||
          ""
        );

      const source =
        escapeHTML(
          document.source ||
          ""
        );

      const pdfURL =
        safeURL(
          document.raw_url ||
          document.url ||
          "#"
        );

      const githubURL =
        safeURL(
          document.url ||
          "#"
        );


      return `
        <div class="card">

          <strong>
            ${index + 1}. ${title}
          </strong>

          <p>
            <b>Owner:</b> ${owner}<br>
            <b>Repository:</b> ${repository}<br>
            <b>Path:</b> ${path}<br>
            <b>Source:</b> ${source}
          </p>

          <p>
            <a
              href="${pdfURL}"
              target="_blank"
              rel="noopener"
            >
              View / Download PDF
            </a>
          </p>

          <p>
            <a
              href="${githubURL}"
              target="_blank"
              rel="noopener"
            >
              View on GitHub
            </a>
          </p>

        </div>
      `;

    }).join("");

}


function escapeHTML(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function safeURL(value){

  try{

    const url =
      new URL(
        value,
        window.location.href
      );

    if(
      url.protocol === "https:" ||
      url.protocol === "http:"
    ){

      return escapeHTML(
        url.href
      );

    }

    return "#";

  }catch{

    return "#";

  }

}


searchBox.addEventListener(
  "input",
  renderDocuments
);

ownerBox.addEventListener(
  "change",
  renderDocuments
);


loadDocuments();

</script>

</body>
</html>
